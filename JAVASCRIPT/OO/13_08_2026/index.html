<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="titulo">Cadastro de Alunos</h1>

    <div id="formulario">
        <label>Nome:</label><br>
        <input type="text" id="nome" placeholder="Digite o nome"><br><br>
        <label>Idade:</label><br>
        <input type="number" id="idade" placeholder="Digite a idade"><br><br>
        <label>Curso:</label><br>
        <input type="text" id="curso" placeholder="Digite o curso"><br><br>
        <label>Matrícula:</label><br>
        <input type="text" id="matricula" placeholder="Digite a matrícula"><br><br>

        <button id="botaoCadastrar">Cadastrar</button>
    </div>

    <div id="resultado"></div>
    <script src="script.js"></script>
</body>
</html>

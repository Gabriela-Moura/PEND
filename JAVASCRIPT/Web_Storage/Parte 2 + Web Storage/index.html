<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="titulo">Sistema de Cadastros</h1>

    <div id="formulario">
        <label>Nome:</label><br>
        <input type="text" id="nome" placeholder="Nome do produto"><br><br>
        <label>Preço:</label><br>
        <input type="number" id="preco" placeholder="Preço"><br><br>
        <label>Categoria:</label><br>
        <input type="text" id="categoria" placeholder="Categoria"><br><br>
        <label>Desconto:</label><br>
        <input type="number" id="desconto" placeholder="Desconto em %"><br><br>

        <button id="botaoCadastrar">Cadastrar</button>
        <button id="botaoRecuperar">Recuperar</button>
    </div>

    <div id="resultado"></div>
    <script src="script.js"></script>
</body>
</html>

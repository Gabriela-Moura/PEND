<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Câmera</title>
</head>
<body>
    <h1>Exemplo Câmera 📷</h1>
    <!-- autoplay permite o inicio da captura assim que o usuário permite o uso, sem precisar de um botão para iniciar a captura -->
    <video id="camera" autoplay style="width: 200px"></video> 

    <canvas id="canvas" style="display: none"></canvas><br>
    
    <button id="botao">Tirar foto</button><br><br>
    
    <img id="foto">   
    
    <script src="script.js"></script>
</body>
</html>

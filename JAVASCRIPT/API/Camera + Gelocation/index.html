<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera + Geolocation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Essa aplicação é para confirmar a presença dos alunos na escola, é a mesma coisa que um sistema de ponto eletrônico. O sistema pede para o aluno aparecer na câmera e apertar o botão confirmar. O sistema vê a localização do aluno (latitude, longitude e precisão). Ao clicar em confirmar o sistema confirma a presença do aluno -->

    <header>
        <img src="logo.png" id="logo" alt="Logo da Escola">
        <h1 class="titulo">Sistema de Presença Escolar</h1>
    </header>

    </main>
        <div id="conteudo">
            <h2>Confirme sua presença</h2>
            <p>Para confirmar sua presença, por favor, posicione-se na frente da câmera e clique no botão "Confirmar".</p>

            <video id="camera" autoplay></video> 

            <div id="localizacao">
                <p id="latitude"></p>
                <p id="longitude"></p>
                <p id="precisao"></p>
            </div>

            <!-- Feedback sobre a confirmação da presença-->
            <p id="feedback"></p><br>

            <button id="confirmar">Confirmar</button>

            <script src="script.js"></script>
        </div>
    </main>
    <footer>
        <p>© 2024 Sistema de Presença Escolar. Todos os direitos reservados.</p>
    </footer>
</body>
</html>

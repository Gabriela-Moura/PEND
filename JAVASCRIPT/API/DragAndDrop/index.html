<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop😊</title>
    <!-- Arrastar e soltar -->
    <!-- Drag And Drop é uma web API -->
</head>
<body>

    <h1>Exemplo - Drag and Drop API</h1>
    
    <h4>Produtos</h4>

    <!-- draggable -> significa que esse elemento é arrastável -->
    <div id="produto" draggable="true">
        💻Notebook
    </div>

    <hr>

    <div id="carrinho">
        <h4>🛒Carrinho (Arraste o produto aqui)</h4>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adivinhe a Raça</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Adivinhe o Cachorro</h1>

        <p>Qual é a raça deste cachorro?</p>

        <!-- Imagem que será preenchida pelo JavaScript -->
        <img id="cachorro" src="" alt="Cachorro">

        <!-- Aqui aparecerão as opções -->
        <div id="opcoes">
        </div>

        <!-- Mensagem de acerto ou erro -->
        <p id="resultado"></p>

        <div>
            <button id="resposta1"></button><br>
            <button id="resposta2"></button><br>
            <button id="resposta3"></button><br>
            <button id="resposta4"></button><br>
        </div>

        <div id="feedback"></div>

        <!-- Botão para buscar outro cachorro -->
        <button id="proximo">Próximo cachorro</button>

        <!-- Pontuação -->
        <p id="pontuacao"></p>

    </main>

    <script src="script.js"></script>

</body>

</html>
